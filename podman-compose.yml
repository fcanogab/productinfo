services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: productinfodb
      POSTGRES_USER: productinfousr
      POSTGRES_PASSWORD: ${DBPASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productinfousr -d productinfodb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "10001:8000"
    environment:
      DBHOST: db
      DBPORT: "5432"
      DBNAME: productinfodb
      DBUSER: productinfousr
      DBPASSWORD: ${DBPASSWORD:-changeme}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-default-change-in-production}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
